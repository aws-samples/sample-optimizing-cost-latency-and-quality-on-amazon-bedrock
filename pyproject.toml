[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-prompt-workshop-utils"
version = "0.1.0"
description = "Reproducible helpers for the Bedrock cost, latency, and quality workshop"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3==1.43.101",
    "botocore==1.43.101",
    "bedrock-agentcore==1.23.1",
    "strands-agents[otel]==1.57.0",
    "strands-agents-tools==0.8.9",
    "aws-opentelemetry-distro==0.20.0",
    "ddgs==9.16.0",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
notebook = [
    "aws-bedrock-token-generator==1.1.0",
    "ipykernel>=7,<8",
    "jupyter>=1.1,<2",
    "nbformat==5.11.1",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "matplotlib>=3.10,<4",
    "tabulate>=0.9,<1",
    "openai==3.19.2",
    "anthropic[bedrock]==1.8.0",
]
langfuse = ["langfuse==4.15.4"]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "cfn-lint==1.57.0",
]

[tool.setuptools.packages.find]
include = ["workshop_utils*"]

[tool.setuptools.package-data]
workshop_utils = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "03-developer-journey"]
addopts = "-ra"

[tool.ruff]
extend = "ruff.toml"
