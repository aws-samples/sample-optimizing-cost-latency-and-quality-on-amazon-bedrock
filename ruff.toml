# Canonical Ruff policy; pyproject.toml extends this file for explicit --config runs.

target-version = "py313"
line-length = 119

extend-exclude = [
    ".venv",
    ".build",
    "node_modules",
]

[lint]
select = [
    "E",    # pycodestyle (error)
    "F",    # pyflakes
    "B",    # bugbear
    "B9",
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "I",    # isort
    "UP",   # pyupgrade
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "PYI",  # flake8-pyi
    "RUF",  # ruff-specific rules
]

ignore = [
    "B011",  # assert-false
    "E501",  # line-too-long
]

[lint.per-file-ignores]
# Notebook setup adjusts sys.path / loads environment before importing helpers.
# Imports also support learner exploration across cells; do not auto-remove them.
# Notebooks do not require a module-wide future-annotations import.
"*.ipynb" = ["E402", "F401", "I002"]
# These entry points deliberately configure imports before loading dependencies.
"03-developer-journey/utils/ragas_eval.py" = ["E402"]  # Install the legacy warning filter.
"04-deep-dive-topics/scripts/run_agentcore_gate.py" = ["E402"]  # Locate the source ZIP root.

[lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
known-first-party = ["agents", "utils"]
