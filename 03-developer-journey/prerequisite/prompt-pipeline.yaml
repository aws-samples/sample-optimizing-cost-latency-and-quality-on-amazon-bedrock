AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS-native prompt quality gate. A notebook uploads a versioned source ZIP and an
  observed candidate replay request, then starts CodeBuild. The build starts and
  polls AgentCore batch evaluation. No Langfuse credentials or CodeCommit required.
  Promotion is an explicit notebook operation after offline and online gates.
  Also provisions the published Advanced Langfuse/CodePipeline workflow within
  the same stack to stay within Workshop Studio's five-template limit.

Parameters:
  ScoreThreshold:
    Type: Number
    Default: 0.7
    MinValue: 0
    MaxValue: 1
    Description: Minimum Correctness average over all held-out cases.
  MinimumScoredCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 500
    Description: Minimum complete scored cases (use an integer).
  EvaluationLogGroupPrefix:
    Type: String
    Default: /aws/bedrock-agentcore/workshop/
    AllowedPattern: '[.\-_/#A-Za-z0-9]+/'
    Description: >-
      Existing replay source log group prefix, including trailing slash. The
      notebook must export to groups under this prefix. Change for Runtime replays.
  BundleNamePrefix:
    Type: String
    Default: WorkshopPrompt
    AllowedPattern: '[A-Za-z][A-Za-z0-9_]{0,80}'
    Description: Only bundles with this name prefix can be read by the gate.

  # Published Advanced Langfuse pipeline settings.
  LegacyLangfuseHost:
    Type: String
    Description: Self-hosted Langfuse URL (e.g., https://langfuse.internal.company.com)
    Default: https://cloud.langfuse.com

  LegacyRepositoryName:
    Type: String
    Description: CodeCommit repository name containing prompt definitions
    Default: prompt-repo

  LegacyBranchName:
    Type: String
    Description: Branch to monitor for changes
    Default: main

  LegacyEvalDatasetName:
    Type: String
    Description: Langfuse dataset name used for evaluation
    Default: customer-support-eval

  LegacyScoreThreshold:
    Type: String
    Description: Minimum average score to pass quality gate (0.0 - 1.0)
    Default: '0.7'

  LegacyPassRateThreshold:
    Type: String
    Description: Minimum pass rate to pass quality gate (0.0 - 1.0)
    Default: '0.8'

  LegacyNotificationEmail:
    Type: String
    Description: Email address for pipeline failure notifications
    Default: ''

Conditions:
  LegacyHasNotificationEmail: !Not [!Equals [!Ref LegacyNotificationEmail, '']]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'techmart-prompt-gate-${AWS::AccountId}-${AWS::Region}'
      Tags:
        - Key: Workshop
          Value: bedrock-prompt-optimization
        - Key: Purpose
          Value: prompt-quality-gate
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireWorkshopArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  ArtifactCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EmptyOnlyOwnedGateBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetBucketTagging, s3:ListBucketVersions]
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: s3:DeleteObjectVersion
                Resource: !Sub '${ArtifactBucket.Arn}/*'
  ArtifactCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Empty only the tagged stack-owned gate bucket on stack deletion.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ArtifactCleanupRole.Arn
      Timeout: 300
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          OWNERSHIP = {
              "Workshop": "bedrock-prompt-optimization",
              "Purpose": "prompt-quality-gate",
          }

          def empty_owned_bucket(s3, bucket, owner, context):
              try:
                  tags = s3.get_bucket_tagging(Bucket=bucket, ExpectedBucketOwner=owner)["TagSet"]
              except ClientError as exc:
                  if exc.response["Error"]["Code"] == "NoSuchBucket":
                      return
                  raise
              actual = {tag["Key"]: tag["Value"] for tag in tags}
              if any(actual.get(key) != value for key, value in OWNERSHIP.items()):
                  raise ValueError("Refusing cleanup: gate bucket ownership tags do not match")
              # Always read the first page again after deleting it. Advancing a
              # marker while mutating the version listing can skip objects.
              while context.get_remaining_time_in_millis() > 20000:
                  page = s3.list_object_versions(Bucket=bucket, ExpectedBucketOwner=owner, MaxKeys=1000)
                  objects = [{"Key": item["Key"], "VersionId": item["VersionId"]}
                             for item in page.get("Versions", []) + page.get("DeleteMarkers", [])]
                  if not objects:
                      if page.get("IsTruncated"):
                          raise RuntimeError("Truncated version listing with no deletable entries")
                      return
                  result = s3.delete_objects(Bucket=bucket, ExpectedBucketOwner=owner,
                                              Delete={"Objects": objects, "Quiet": True})
                  if result.get("Errors"):
                      raise RuntimeError("S3 version cleanup failed: " + str(result["Errors"]))
              raise TimeoutError("Bucket cleanup exceeded budget; retry stack deletion to finish")

          def handler(event, context):
              props = event["ResourceProperties"]
              bucket = props["BucketName"]
              status, reason = "SUCCESS", "Owned gate bucket cleanup complete"
              try:
                  if event["RequestType"] == "Delete":
                      s3 = boto3.client("s3", config=Config(connect_timeout=3, read_timeout=10,
                                                          retries={"total_max_attempts": 2}))
                      empty_owned_bucket(s3, bucket, props["AccountId"], context)
              except Exception as exc:
                  status, reason = "FAILED", str(exc)[:1000]
              body = json.dumps({
                  "Status": status, "Reason": reason,
                  "PhysicalResourceId": event.get("PhysicalResourceId", "owned-gate-bucket:" + bucket),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode()
              request = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                               headers={"Content-Type": "", "Content-Length": str(len(body))})
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
  EmptyArtifactBucket:
    Type: Custom::EmptyOwnedGateBucket
    Properties:
      ServiceToken: !GetAtt ArtifactCleanupFunction.Arn
      ServiceTimeout: 360
      BucketName: !Ref ArtifactBucket
      AccountId: !Ref AWS::AccountId
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ObservedCandidateGate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObjectVersion]
                Resource:
                  - !Sub '${ArtifactBucket.Arn}/source/*'
                  - !Sub '${ArtifactBucket.Arn}/requests/*'
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/results/*'
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl]
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogGroup.Arn
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetConfigurationBundle
                  - bedrock-agentcore:GetConfigurationBundleVersion
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:configuration-bundle/${BundleNamePrefix}*'
              # Batch evaluation uses the caller identity, not an execution role.
              # Official batch-evaluations-prereqs documents batch-evaluate/*.
              # There are no promotion or model invocation rights.
              - Effect: Allow
                Action: [bedrock-agentcore:StartBatchEvaluation, bedrock-agentcore:GetBatchEvaluation]
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:batch-evaluate/*'
              - Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:DescribeLogStreams
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${EvaluationLogGroupPrefix}*'
              - Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery, logs:DescribeLogGroups]
                Resource: '*'
              # Split Runtime telemetry keeps full spans in this exact shared
              # group. No write/retention/delete permission on aws/spans.
              - Effect: Allow
                Action: [logs:StartQuery, logs:FilterLogEvents, logs:GetLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*'
  EvaluationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'techmart-prompt-gate-${AWS::Region}'
      Tags:
        - Key: Workshop
          Value: bedrock-prompt-optimization
        - Key: Purpose
          Value: prompt-quality-gate
      Description: Evaluate an immutable candidate against observed held-out replay sessions.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 15
      QueuedTimeoutInMinutes: 30
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: S3
        Location: !Ref ArtifactBucket
        Path: results
        NamespaceType: BUILD_ID
        Name: gate-output.zip
        Packaging: ZIP
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucket
          - Name: EXPECTED_BUCKET_OWNER
            Value: !Ref AWS::AccountId
          - Name: MIN_SCORE
            Value: !Ref ScoreThreshold
          - Name: MIN_SCORED_COUNT
            Value: !Ref MinimumScoredCount
          - Name: SOURCE_KEY
            Value: ''
          - Name: SOURCE_VERSION
            Value: ''
          - Name: SOURCE_SHA256
            Value: ''
          - Name: REQUEST_KEY
            Value: ''
          - Name: REQUEST_VERSION
            Value: ''
          - Name: REQUEST_SHA256
            Value: ''
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - python -m pip install 'boto3==1.43.101' 'botocore==1.43.101'
            pre_build:
              commands:
                - |
                  python - <<'PY'
                  import hashlib, io, os, re, zipfile
                  from pathlib import Path
                  import boto3
                  from botocore.config import Config
                  s3 = boto3.client('s3', config=Config(connect_timeout=3, read_timeout=30, retries={'total_max_attempts': 2}))
                  def download(kind, prefix, limit):
                      key, version, sha = [os.environ[kind + '_' + k] for k in ('KEY', 'VERSION', 'SHA256')]
                      if not re.fullmatch(prefix + r'/[a-f0-9]{64}\.(zip|json)', key) or not version or version == 'null':
                          raise ValueError('Missing versioned artifact or invalid input prefix: ' + kind)
                      if not re.fullmatch(r'[a-f0-9]{64}', sha):
                          raise ValueError('Missing artifact digest: ' + kind)
                      obj = s3.get_object(Bucket=os.environ['ARTIFACT_BUCKET'], Key=key, VersionId=version,
                                          ExpectedBucketOwner=os.environ['EXPECTED_BUCKET_OWNER'])
                      if obj['ContentLength'] > limit:
                          raise ValueError('Artifact exceeds size limit')
                      data = obj['Body'].read(limit + 1)
                      if len(data) > limit or hashlib.sha256(data).hexdigest() != sha:
                          raise ValueError('Artifact digest mismatch: ' + kind)
                      return data
                  source = download('SOURCE', 'source', 2_000_000)
                  expected = {'workshop_utils/__init__.py', 'workshop_utils/lifecycle.py', 'scripts/run_agentcore_gate.py'}
                  with zipfile.ZipFile(io.BytesIO(source)) as z:
                      if set(z.namelist()) != expected or len(z.infolist()) != len(expected):
                          raise ValueError('Source ZIP must contain only the three reviewed gate files')
                      for info in z.infolist():
                          if info.file_size > 1_000_000:
                              raise ValueError('Oversized source member')
                          path = Path(info.filename)
                          path.parent.mkdir(parents=True, exist_ok=True)
                          path.write_bytes(z.read(info))
                  Path('request.json').write_bytes(download('REQUEST', 'requests', 5_000_000))
                  PY
            build:
              commands:
                - python scripts/run_agentcore_gate.py --request request.json --output evaluation_results.json --min-score "$MIN_SCORE" --min-scored-count "$MIN_SCORED_COUNT" --timeout-s 360
          artifacts:
            files:
              - evaluation_results.json
              - request.json

  # Published Advanced Langfuse pipeline resources.
  # --- CodeCommit repository ---
  LegacyPromptRepository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Ref LegacyRepositoryName
      RepositoryDescription: >
        Prompt evaluation repository for CI/CD workshop.
        Participants push evaluation scripts here to trigger the pipeline.

  # --- Secrets Manager for Langfuse credentials (placeholder) ---
  LegacyLangfuseCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: langfuse-pipeline-credentials
      Description: >
        Langfuse API credentials for prompt evaluation pipeline.
        Created with placeholder values -- participants populate via notebook.
      SecretString: '{"public_key":"PLACEHOLDER","secret_key":"PLACEHOLDER","host":"PLACEHOLDER"}'

  # --- S3 bucket for pipeline artifacts ---
  LegacyArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'prompt-pipeline-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # --- SNS topic for notifications ---
  LegacyPipelineNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: LegacyHasNotificationEmail
    Properties:
      TopicName: prompt-pipeline-notifications
      Subscription:
        - Endpoint: !Ref LegacyNotificationEmail
          Protocol: email

  # --- CodeBuild project for evaluation ---
  LegacyEvaluationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: prompt-evaluation
      Description: Runs prompt evaluation against Langfuse dataset
      ServiceRole: !GetAtt LegacyCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: EVAL_PROMPT_NAME
            Value: customer-support-system
          - Name: EVAL_PROMPT_LABEL
            Value: draft
          - Name: EVAL_DATASET_NAME
            Value: !Ref LegacyEvalDatasetName
          - Name: EVAL_SCORE_THRESHOLD
            Value: !Ref LegacyScoreThreshold
          - Name: EVAL_PASS_RATE_THRESHOLD
            Value: !Ref LegacyPassRateThreshold
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          env:
            secrets-manager:
              LANGFUSE_PUBLIC_KEY: "langfuse-pipeline-credentials:public_key"
              LANGFUSE_SECRET_KEY: "langfuse-pipeline-credentials:secret_key"
              LANGFUSE_BASE_URL: "langfuse-pipeline-credentials:host"
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - pip install -q langfuse==4.15.4 boto3==1.43.101 botocore==1.43.101 httpx==0.28.1
            pre_build:
              commands:
                - echo "Evaluating prompt '$EVAL_PROMPT_NAME' (label=$EVAL_PROMPT_LABEL) from Langfuse..."
                - echo "Dataset = $EVAL_DATASET_NAME"
                - echo "Score threshold = $EVAL_SCORE_THRESHOLD"
            build:
              commands:
                - echo "Running prompt evaluation..."
                - python scripts/evaluate_prompt.py
            post_build:
              commands:
                - echo "Evaluation complete"
                - python scripts/check_quality_gate.py
          artifacts:
            files:
              - evaluation_results.json
          cache:
            paths:
              - "/root/.cache/pip/**/*"
      TimeoutInMinutes: 15

  # --- Lambda function for CodePipeline deploy action ---
  # After manual approval, this promotes the draft prompt to production
  # in Langfuse and updates the SSM baseline score.
  # Uses Langfuse REST API directly (no SDK dependency, no Lambda layers).
  LegacyDeployPromptLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: prompt-deployer
      Description: Promotes draft prompt to production in Langfuse after approval
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LegacyLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          LANGFUSE_CREDENTIALS_SECRET: !Ref LegacyLangfuseCredentials
          PROMPT_NAME: customer-support-system
          SSM_BASELINE_PARAM: /prompt-pipeline/production-baseline-score
      Code:
        ZipFile: |
          """
          CodePipeline deploy action: promote draft prompt to production in Langfuse.
          Uses Langfuse REST API directly — no SDK or Lambda layers needed.
          """
          import json
          import os
          import urllib.request
          import urllib.parse
          import base64
          import boto3
          import io
          import math
          import zipfile

          codepipeline = boto3.client("codepipeline")
          secrets_manager = boto3.client("secretsmanager")
          ssm = boto3.client("ssm")


          def _langfuse_request(method, path, host, auth_header, body=None):
              """Make an authenticated request to the Langfuse API."""
              url = f"{host.rstrip('/')}/api/public{path}"
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", auth_header)
              req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())


          def lambda_handler(event, context):
              job_id = event["CodePipeline.job"]["id"]
              try:
                  # Retrieve Langfuse credentials from Secrets Manager
                  secret_arn = os.environ["LANGFUSE_CREDENTIALS_SECRET"]
                  secret_value = secrets_manager.get_secret_value(SecretId=secret_arn)
                  creds = json.loads(secret_value["SecretString"])

                  host = creds.get("host", "https://cloud.langfuse.com")
                  auth = base64.b64encode(
                      f"{creds['public_key']}:{creds['secret_key']}".encode()
                  ).decode()
                  auth_header = f"Basic {auth}"

                  prompt_name = os.environ.get("PROMPT_NAME", "customer-support-system")
                  encoded_name = urllib.parse.quote(prompt_name, safe="")

                  # Read the exact evaluation approved by this pipeline execution.
                  artifacts = event["CodePipeline.job"]["data"]["inputArtifacts"]
                  if len(artifacts) != 1:
                      raise ValueError("Expected one evaluation artifact")
                  location = artifacts[0]["location"]["s3Location"]
                  response = boto3.client("s3").get_object(
                      Bucket=location["bucketName"], Key=location["objectKey"],
                  )
                  try:
                      archive_bytes = response["Body"].read()
                  finally:
                      response["Body"].close()
                  with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                      evaluated = json.loads(archive.read("evaluation_results.json"))
                  if evaluated.get("prompt_name") != prompt_name:
                      raise ValueError("Evaluation artifact belongs to a different prompt")
                  draft_version = evaluated["prompt_version"]
                  avg_score = evaluated["avg_score"]
                  if type(draft_version) is not int or draft_version < 1:
                      raise ValueError("Missing evaluated prompt version")
                  if not isinstance(avg_score, (int, float)) or not math.isfinite(avg_score) or not 0 <= avg_score <= 1:
                      raise ValueError("Invalid evaluated score")
                  prod = _langfuse_request(
                      "GET", f"/v2/prompts/{encoded_name}?label=production", host, auth_header,
                  )
                  prod_version = prod["version"]

                  # 2. Promote draft → production label
                  # (Langfuse auto-removes "production" from old version)
                  _langfuse_request(
                      "PATCH",
                      f"/v2/prompts/{encoded_name}/versions/{draft_version}",
                      host, auth_header,
                      body={"newLabels": ["production"]},
                  )

                  # Keep retries from deprecating the version just promoted.
                  if prod_version != draft_version:
                      _langfuse_request(
                          "PATCH",
                          f"/v2/prompts/{encoded_name}/versions/{prod_version}",
                          host, auth_header, body={"newLabels": ["deprecated"]},
                      )
                  ssm.put_parameter(
                      Name=os.environ["SSM_BASELINE_PARAM"], Value=str(avg_score),
                      Type="String", Overwrite=True,
                  )

                  # 4. Report success to CodePipeline
                  codepipeline.put_job_success_result(
                      jobId=job_id,
                      outputVariables={
                          "promoted_version": str(draft_version),
                          "prompt_name": prompt_name,
                      },
                  )
                  return {
                      "status": "PROMOTED",
                      "prompt": prompt_name,
                      "draft_version": draft_version,
                      "old_prod_version": prod_version,
                  }

              except Exception as e:
                  codepipeline.put_job_failure_result(
                      jobId=job_id,
                      failureDetails={"type": "JobFailed", "message": str(e)},
                  )
                  raise

  # --- CodePipeline ---
  LegacyPromptPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: prompt-evaluation-pipeline
      RoleArn: !GetAtt LegacyPipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref LegacyArtifactBucket
      Stages:
        # Stage 1: Source
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: !Ref LegacyRepositoryName
                BranchName: !Ref LegacyBranchName
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceOutput

        # Stage 2: Build and evaluate
        - Name: BuildAndEvaluate
          Actions:
            - Name: RunEvaluation
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref LegacyEvaluationProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: EvalOutput

        # Stage 3: Manual approval
        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: >
                  Review evaluation results in Langfuse before
                  deploying prompt to production.

        # Stage 4: Deploy prompt (via Lambda)
        - Name: Deploy
          Actions:
            - Name: DeployPrompt
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: Lambda
                Version: '1'
              Configuration:
                FunctionName: !Ref LegacyDeployPromptLambda
                UserParameters: !Sub |
                  {"dataset": "${LegacyEvalDatasetName}", "threshold": ${LegacyScoreThreshold}}
              InputArtifacts:
                - Name: EvalOutput

  # --- IAM Roles ---

  LegacyCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prompt-eval-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InferenceOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-5'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-opus-5'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-5'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-opus-5'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0'
        - PolicyName: CodeBuildBase
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt LegacyArtifactBucket.Arn
                  - !Sub '${LegacyArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*'
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref LegacyLangfuseCredentials
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/prompt-pipeline/*'

  LegacyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prompt-eval-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadApprovedEvaluation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${LegacyArtifactBucket.Arn}/*'
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:PutJobSuccessResult
                  - codepipeline:PutJobFailureResult
                Resource: '*'
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref LegacyLangfuseCredentials
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/prompt-pipeline/*'

  LegacyPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prompt-eval-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt LegacyArtifactBucket.Arn
                  - !Sub '${LegacyArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !Sub 'arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${LegacyRepositoryName}'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt LegacyEvaluationProject.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt LegacyDeployPromptLambda.Arn

Outputs:
  EvaluationProjectName:
    Description: Pass this project name to CodeBuild StartBuild from the notebook.
    Value: !Ref EvaluationProject
  EvaluationProjectArn:
    Description: Scope participant StartBuild/BatchGetBuilds permission to this project.
    Value: !GetAtt EvaluationProject.Arn
  PipelineName:
    Description: Compatibility name for the managed quality gate CodeBuild project.
    Value: !Ref EvaluationProject
  PipelineUrl:
    Description: AWS-native quality gate builds and logs.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${EvaluationProject}/history'
  ArtifactBucketName:
    Description: Versioned source/, requests/, and results/ artifacts; restrict input writers.
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Description: Scope participant input uploads, version reads and listings to this bucket.
    Value: !GetAtt ArtifactBucket.Arn
  CodeBuildRoleArn:
    Description: Evaluation-only role. No bundle write or promotion rights.
    Value: !GetAtt CodeBuildRole.Arn

  # Published Advanced Langfuse pipeline outputs.
  LegacyPipelineName:
    Description: Name of the CodePipeline
    Value: !Ref LegacyPromptPipeline

  LegacyPipelineUrl:
    Description: URL to view the pipeline in the AWS Console
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${LegacyPromptPipeline}/view'

  LegacyEvaluationProjectName:
    Description: Name of the CodeBuild evaluation project
    Value: !Ref LegacyEvaluationProject

  LegacyArtifactBucketName:
    Description: S3 bucket for pipeline artifacts
    Value: !Ref LegacyArtifactBucket

  LegacyRepositoryCloneUrl:
    Description: HTTPS clone URL for the CodeCommit repository
    Value: !GetAtt LegacyPromptRepository.CloneUrlHttp

  LegacySecretName:
    Description: Secrets Manager secret name for Langfuse credentials
    Value: !Ref LegacyLangfuseCredentials
