---
AWSTemplateFormatVersion: "2010-09-09"

Description: |-
  Quick-start CloudFormation template to deploy the CDK-based infrastructure sample via AWS
  CodeBuild - with no local CDK/Docker/Python/etc developer setup required.

  This stack sets up an AWS CodeBuild Project to deploy the main solution and triggers the build
  once (via AWS Lambda) on stack create, plus again whenever the CodeBuildTrigger resource is
  updated. On deletion, it triggers another CodeBuild job to attempt to destroy the CDK stack.
  Grants broad permissions to CodeBuild - not recommended for use in production environments.

Parameters:
  DeployLangfuse:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Provision Langfuse alongside the workshop's AWS-native services so participants can
      use either observability path. Set false only for a custom deployment that excludes
      Langfuse; in that case its resources are omitted and outputs contain DISABLED.

  AuthType:
    Type: String
    AllowedValues:
      - 'cognito'
      - 'langfuse'
    Default: 'cognito'
    Description: >-
      We recommend 'cognito' to manage your Langfuse users through Amazon Cognito. The 'langfuse'
      native auth will have public user sign-up enabled by default through the web UI!

  ClickHouseContainerImage:
    Type: String
    Default: 'docker.io/bitnamilegacy/clickhouse:25.7.5'
    Description: >-
      Source container image (including version) for ClickHouse OLAP (a dependency of Langfuse).
      Preserve the tested docker.io/bitnamilegacy/clickhouse:25.7.5 pairing with Langfuse web
      and worker 3.153.0. Its non-root layout matches the CDK app's bitnami.Dockerfile.
      For preload or image-pull failures, check archive access, checksum, and build logs;
      retry transient failures with the same image. Changing the image version or distribution
      requires a separately validated, coordinated migration.

  LangfuseWebContainerImage:
    Type: String
    Default: 'ghcr.io/langfuse/langfuse:3.153.0'
    Description: >-
      Source container image (including version) for main Langfuse web service container.

  LangfuseWorkerContainerImage:
    Type: String
    Default: 'ghcr.io/langfuse/langfuse-worker:3.153.0'
    Description: >-
      Source container image (including version) for main Langfuse background worker container.

  CodeRepo:
    Type: String
    Default: https://github.com/aws-samples/amazon-bedrock-samples
    Description: >-
      The CDK code to be deployed: A git clone-able URL, public .zip archive URL, or s3:// URI to a
      zip archive.

  CodeRepoBranch:
    Type: String
    # Verified via GitHub refs/heads/main and source inspection on 2026-09-24:
    # https://github.com/aws-samples/amazon-bedrock-samples/commit/b5ad367ad897dc8dbb9af0f671b58129d4e19672
    # bin/demo.ts accepts our image/auth overrides; lib/stack.ts exports LangfuseDemo outputs;
    # ClickHouse uses bitnami.Dockerfile and LINUX_AMD64. package-lock.json matches package.json.
    Default: b5ad367ad897dc8dbb9af0f671b58129d4e19672
    Description: >-
      Full commit SHA, branch, or tag to fetch and check out detached. The default is an inspected
      immutable commit; branch/tag overrides are mutable. Ignored if CodeRepo is not a git URL.

  CodeRepoFolder:
    Type: String
    Default: evaluation-observe/deploy-langfuse-on-ecs-fargate-with-typescript-cdk
    Description: >-
      Subfolder in the repository containing the deployable CDK app. Leading slash optional. Set
      '/' (not empty) for root folder.

  AssetsBucketName:
    Type: String
    Default: ''
    Description: >-
      (Optional) Workshop Studio assets bucket name (injected via the {{.AssetsBucketName}} magic
      variable). When set, the build validates and preloads the ClickHouse base image from a
      docker-save tarball. A blank bucket or failed download uses the registry (with deploy retry).
      A downloaded archive that fails checksum, tag, platform, or load checks fails the build.

  AssetsBucketPrefix:
    Type: String
    Default: ''
    Description: >-
      (Optional) Assets bucket prefix (injected via {{.AssetsBucketPrefix}}; ends with '/'). The
      build looks for the image tarball at s3://<AssetsBucketName>/<AssetsBucketPrefix>clickhouse-image.tar.gz
      (docker save piped through gzip; docker load reads it directly). Blank means bucket root.

  ClickHouseArchiveSha256:
    Type: String
    Default: '0061c2c1f7df1f93b376f8b73aee0fb25a1d9ba817a4ca7a9299bba44d723eff'
    AllowedPattern: '^([a-fA-F0-9]{64})?$'
    ConstraintDescription: Must be empty or a 64-character hexadecimal SHA-256.
    Description: >-
      Expected SHA-256 of clickhouse-image.tar.gz. Defaults to the verified workshop archive for
      bitnamilegacy/clickhouse:25.7.5 (linux/amd64). Supply a new digest for a replacement archive.
      Empty explicitly skips checksum verification; tag and platform checks are still required.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Solution Settings
        Parameters:
          - DeployLangfuse
          - AuthType
          - LangfuseWebContainerImage
          - LangfuseWorkerContainerImage
          - ClickHouseContainerImage
      - Label:
          default: Source Code Location
        Parameters:
          - CodeRepo
          - CodeRepoBranch
          - CodeRepoFolder
      - Label:
          default: Workshop Studio Assets (optional ClickHouse image preload)
        Parameters:
          - AssetsBucketName
          - AssetsBucketPrefix
          - ClickHouseArchiveSha256

Conditions:
  LangfuseEnabled: !Equals [!Ref DeployLangfuse, 'true']
  LangfuseCognitoEnabled: !And
    - !Condition LangfuseEnabled
    - !Equals [!Ref AuthType, 'cognito']

Resources:
  CodeBuildServiceRole:
    Type: "AWS::IAM::Role"
    Condition: LangfuseEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Not recommended for use in production environments: Grants CodeBuild broad access to deploy/destroy the CDK solution without scoping down individual required services & resources"
          - id: W44
            reason: "Not recommended for use in production environments: Grants CodeBuild broad access to deploy/destroy the CDK solution without scoping down individual required services & resources"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: StackDeploymentPerms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The solution makes extensive use of IAM Roles, so we need broad permissions to
              # deploy/update/destroy those... But we should have no need to touch certain
              # other types of resource like Users, Groups, etc: So can still enforce some control
              # points:
              - Sid: IAMUnscoped
                Effect: Allow
                Action:
                  - "iam:ListOrganizationsFeatures"
                  - "iam:ListPolicies"
                  - "iam:ListRoles"
                  - "iam:ListSTSRegionalEndpointsStatus"
                Resource:
                  - "*"
              - Sid: IAMPolicies
                Effect: Allow
                Action:
                  - "iam:CreatePolicy"
                  - "iam:CreatePolicyVersion"
                  - "iam:DeletePolicy"
                  - "iam:DeletePolicyVersion"
                  - "iam:GetPolicy"
                  - "iam:GetPolicyVersion"
                  - "iam:ListEntitiesForPolicy"
                  - "iam:ListPolicyTags"
                  - "iam:ListPolicyVersions"
                  - "iam:SetDefaultPolicyVersion"
                  - "iam:TagPolicy"
                  - "iam:UntagPolicy"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*"
              - Sid: IAMRoles
                Effect: Allow
                Action:
                  - "iam:AttachRolePolicy"
                  - "iam:CreateRole"
                  - "iam:CreateServiceLinkedRole"
                  - "iam:DeleteRole"
                  # EXCLUDE DeleteRolePermissionsBoundary
                  - "iam:DeleteRolePolicy"
                  - "iam:DeleteServiceLinkedRole"
                  - "iam:DetachRolePolicy"
                  - "iam:GetContextKeysForPrincipalPolicy"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:GetServiceLinkedRoleDeletionStatus"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListInstanceProfilesForRole"
                  - "iam:ListPoliciesGrantingServiceAccess"
                  - "iam:ListRolePolicies"
                  - "iam:ListRoleTags"
                  - "iam:PassRole"
                  # EXCLUDE PutRolePermissionsBoundary
                  - "iam:PutRolePolicy"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:UpdateRole"
                  - "iam:UpdateRoleDescription"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/PowerUserAccess"

  CodeBuildProject:
    Type: "AWS::CodeBuild::Project"
    Condition: LangfuseEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: "Use default S3 encryption - no actual artifacts being created"
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      ConcurrentBuildLimit: 1
      Description: "CDK stack deployer"
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        EnvironmentVariables:
          # Pass CFn stack parameters through to the deploy job:
          - Name: CLICKHOUSE_IMAGE
            Type: PLAINTEXT
            Value: !Ref ClickHouseContainerImage
          - Name: LANGFUSE_AUTH_TYPE
            Type: PLAINTEXT
            Value: !Ref AuthType
          - Name: LANGFUSE_WEB_IMAGE
            Type: PLAINTEXT
            Value: !Ref LangfuseWebContainerImage
          - Name: LANGFUSE_WORKER_IMAGE
            Type: PLAINTEXT
            Value: !Ref LangfuseWorkerContainerImage
          - Name: PUBLIC_REPO
            Type: PLAINTEXT
            Value: !Ref CodeRepo
          - Name: PUBLIC_REPO_BRANCH
            Type: PLAINTEXT
            Value: !Ref CodeRepoBranch
          - Name: PUBLIC_REPO_FOLDER
            Type: PLAINTEXT
            Value: !Ref CodeRepoFolder
          - Name: ASSETS_BUCKET_NAME
            Type: PLAINTEXT
            Value: !Ref AssetsBucketName
          - Name: ASSETS_BUCKET_PREFIX
            Type: PLAINTEXT
            Value: !Ref AssetsBucketPrefix
          - Name: CLICKHOUSE_ARCHIVE_SHA256
            Type: PLAINTEXT
            Value: !Ref ClickHouseArchiveSha256
        Image: "aws/codebuild/standard:7.0"
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true # Need to build container images within the project
        Type: LINUX_CONTAINER
      QueuedTimeoutInMinutes: 80
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Source:
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              commands:
                - set -ex
                # Up-front install to fail early (but we reinst later in case it's overwritten):
                - pip3 install "requests>=2.27,<3"
              runtime-versions:
                nodejs: 22  # Update from default (v18) to latest supported NodeJS runtime
            build:
              commands:
                - set -ex
                # Fetch the source code via either S3 CLI, curl (if PUBLIC_REPO ends with '.zip')
                # or else git:
                - |
                  case "$PUBLIC_REPO" in
                    s3://*)
                      aws s3 cp "$PUBLIC_REPO" code.zip && unzip -oq code.zip -d code
                      export PUBLIC_REPO_IS_ARCHIVE=true
                      ;;
                    *.zip)
                      curl --fail --location "$PUBLIC_REPO" -o code.zip && unzip -oq code.zip -d code
                      export PUBLIC_REPO_IS_ARCHIVE=true
                      ;;
                    *)
                      git init code
                      git -C code remote add origin "$PUBLIC_REPO"
                      git -C code fetch --depth 1 origin "$PUBLIC_REPO_BRANCH"
                      git -C code checkout --detach FETCH_HEAD
                      SOURCE_COMMIT="$(git -C code rev-parse HEAD)"
                      if [[ "$PUBLIC_REPO_BRANCH" =~ ^[a-fA-F0-9]{40}$ ]] &&
                         [ "$SOURCE_COMMIT" != "${PUBLIC_REPO_BRANCH,,}" ]; then
                        echo "ERROR: Fetched commit $SOURCE_COMMIT does not match $PUBLIC_REPO_BRANCH" >&2
                        exit 1
                      fi
                      echo "CDK source commit: $SOURCE_COMMIT"
                      export PUBLIC_REPO_IS_ARCHIVE=false
                      ;;
                  esac
                - cd code
                # Handle potential folder nesting if source code was extracted from a zip/archive:
                - |
                  if [ "$PUBLIC_REPO_IS_ARCHIVE" = "true" ]; then
                    N_EXTRACTED_SUBFOLDERS="$(find . -type d -mindepth 1 -maxdepth 1 | wc -l)"
                    N_EXTRACTED_SUBFILES="$(find . -type f -mindepth 1 -maxdepth 1 | wc -l)"
                    if [ \( $N_EXTRACTED_SUBFOLDERS -eq "1" \) -a \( $N_EXTRACTED_SUBFILES -eq "0" \) ]; then
                      echo "Zip extracted one top-level folder. Treating that as code root"
                      cd "$(ls -d */|head -n 1)"
                    fi
                  fi
                # Move to the subfolder if needed
                # ('#/' parameter expansion ignores leading slash if present)
                - cd "./${PUBLIC_REPO_FOLDER#/}" && pwd
                # Only a missing bucket/failed download may fall back to registry pull + deploy
                # retry. Once downloaded, validation/load errors fail closed before CDK runs.
                # Verify archive metadata before loading, then inspect the exact loaded tag/ID.
                - |
                  (
                    set -euo pipefail
                    if [ -z "$ASSETS_BUCKET_NAME" ]; then
                      echo "Registry fallback: no assets bucket configured; CDK will pull $CLICKHOUSE_IMAGE"
                      exit 0
                    fi
                    PRELOAD_DIR="$(mktemp -d)"
                    trap 'rm -rf "$PRELOAD_DIR"' EXIT
                    ARCHIVE_PATH="$PRELOAD_DIR/clickhouse-image.tar.gz"
                    ASSET_PREFIX="${ASSETS_BUCKET_PREFIX%/}"
                    ASSET_URI="s3://${ASSETS_BUCKET_NAME}/${ASSET_PREFIX:+${ASSET_PREFIX}/}clickhouse-image.tar.gz"
                    echo "Attempting ClickHouse image preload from $ASSET_URI"
                    if ! aws s3 cp "$ASSET_URI" "$ARCHIVE_PATH"; then
                      echo "Registry fallback: asset download failed; CDK will pull $CLICKHOUSE_IMAGE"
                      exit 0
                    fi
                    EXPECTED_IMAGE_ID="$(python3 - "$ARCHIVE_PATH" "$CLICKHOUSE_IMAGE" <<'PY'
                  import hashlib
                  import json
                  import os
                  import sys
                  import tarfile

                  archive_path, expected_tag = sys.argv[1:]
                  expected_sha = os.environ["CLICKHOUSE_ARCHIVE_SHA256"].lower()
                  archive_hash = hashlib.sha256()
                  with open(archive_path, "rb") as archive_file:
                      for chunk in iter(lambda: archive_file.read(1024 * 1024), b""):
                          archive_hash.update(chunk)
                  actual_sha = archive_hash.hexdigest()
                  print(f"Downloaded ClickHouse archive SHA-256: {actual_sha}", file=sys.stderr)
                  if expected_sha:
                      if actual_sha != expected_sha:
                          raise ValueError("ClickHouse archive checksum mismatch")
                      print("Archive checksum verified", file=sys.stderr)
                  else:
                      print("WARNING: Archive checksum verification explicitly skipped", file=sys.stderr)

                  def normalize_tag(tag):
                      for prefix in ("docker.io/", "index.docker.io/"):
                          if tag.startswith(prefix):
                              return tag[len(prefix):]
                      return tag

                  # Read only metadata; never extract archive paths onto the build filesystem.
                  with tarfile.open(archive_path, "r:gz") as archive:
                      manifest = json.load(archive.extractfile("manifest.json"))
                      matches = [
                          entry for entry in manifest
                          if any(normalize_tag(tag) == normalize_tag(expected_tag)
                                 for tag in (entry.get("RepoTags") or []))
                      ]
                      if len(matches) != 1:
                          raise ValueError(f"Archive must contain exactly one image tagged {expected_tag}")
                      config_bytes = archive.extractfile(matches[0]["Config"]).read()
                      config = json.loads(config_bytes)
                      platform = f"{config.get('os')}/{config.get('architecture')}"
                      if platform != "linux/amd64":
                          raise ValueError(f"Archive platform {platform}; expected linux/amd64")
                      print("sha256:" + hashlib.sha256(config_bytes).hexdigest())
                  PY
                    )" || {
                      echo "ERROR: ClickHouse archive validation failed; refusing registry fallback" >&2
                      exit 1
                    }
                    if ! docker load -i "$ARCHIVE_PATH"; then
                      echo "ERROR: ClickHouse docker load failed; refusing registry fallback" >&2
                      exit 1
                    fi
                    if ! LOADED_IMAGE="$(docker image inspect "$CLICKHOUSE_IMAGE" \
                        --format '{{.Id}} {{.Os}}/{{.Architecture}}')"; then
                      echo "ERROR: Expected ClickHouse tag missing after load; refusing registry fallback" >&2
                      exit 1
                    fi
                    if [ "$LOADED_IMAGE" != "$EXPECTED_IMAGE_ID linux/amd64" ]; then
                      echo "ERROR: Loaded ClickHouse image ID/platform mismatch; refusing registry fallback" >&2
                      exit 1
                    fi
                    echo "Preload OK: verified $CLICKHOUSE_IMAGE ($LOADED_IMAGE); local base image ready for CDK"
                  )
                # Actual deploy/destroy instructions for this repository:
                - |
                  if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                    npm ci
                  else
                    echo "No npm lockfile found in source override; using npm install (dependencies are not locked)"
                    npm install
                  fi
                # Bootstrap only a new environment. Never update an existing CDKToolkit
                # (its roles, policies and assets may be shared), including during Delete.
                - |
                  (
                    set -euo pipefail
                    case "${CFN_EVENT_TYPE:-}" in
                      Delete)
                        echo "Skipping CDK bootstrap for Delete"
                        ;;
                      Create|Update)
                        BOOTSTRAP_ERROR="$(mktemp)"
                        trap 'rm -f "$BOOTSTRAP_ERROR"' EXIT
                        if BOOTSTRAP_STATUS="$(aws cloudformation describe-stacks \
                            --stack-name CDKToolkit --query 'Stacks[0].StackStatus' \
                            --output text 2>"$BOOTSTRAP_ERROR")"; then
                          case "$BOOTSTRAP_STATUS" in
                            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
                              echo "Reusing existing CDKToolkit ($BOOTSTRAP_STATUS); bootstrap unchanged"
                              ;;
                            *)
                              echo "ERROR: CDKToolkit is $BOOTSTRAP_STATUS; leaving it unchanged" >&2
                              exit 1
                              ;;
                          esac
                        elif grep -Eq '^(aws: \[ERROR\]: )?An error occurred \(ValidationError\) when calling the DescribeStacks operation: Stack with id CDKToolkit does not exist[[:space:]]*$' "$BOOTSTRAP_ERROR"; then
                          echo "CDKToolkit does not exist; initializing CDK bootstrap"
                          npx cdk bootstrap
                        else
                          cat "$BOOTSTRAP_ERROR" >&2
                          echo "ERROR: Cannot determine CDKToolkit state; refusing to bootstrap" >&2
                          exit 1
                        fi
                        ;;
                      *)
                        echo "ERROR: Unsupported CFN_EVENT_TYPE: ${CFN_EVENT_TYPE:-unset}" >&2
                        exit 1
                        ;;
                    esac
                  )
                # Deploy with retry/backoff: the CDK app builds a ClickHouse image FROM a
                # Docker Hub base, and shared workshop-account IPs frequently hit Docker Hub's
                # anonymous pull-rate limit (HTTP 429), which resets over time. Retrying lets a
                # transient 429 recover instead of failing the whole stack. Destroy is not retried.
                - |
                  if [ "$CFN_EVENT_TYPE" = "Delete" ]; then
                    npx cdk destroy --all --force
                  else
                    attempt=1
                    max_attempts=5
                    until npx cdk deploy --all --concurrency 8 --require-approval never --outputs-file cdk.outputs.json; do
                      if [ "$attempt" -ge "$max_attempts" ]; then
                        echo "cdk deploy failed after $attempt attempts; giving up"
                        exit 1
                      fi
                      sleep_secs=$((30 * 2 ** (attempt - 1)))
                      echo "cdk deploy attempt $attempt failed; retrying in ${sleep_secs}s (likely a Docker Hub 429 rate limit)"
                      sleep "$sleep_secs"
                      attempt=$((attempt + 1))
                    done
                  fi
              finally:
                # Re-install requests in case it got overwritten:
                - pip3 install "requests>=2.27,<3"
                - |
                  cat <<'EOS' | python3 -
                  import json
                  import os
                  import requests  # (You'll need to install this!)
                  resp_url = os.environ.get("CFN_EVENT_RESPONSE_URL")

                  def flatten(d, parent_key="", sep="."):
                      """Flatten nested JSON dicts (basic, doesn't touch arrays)

                      CFn allows us to return complex attribute data types, but doesn't have good
                      ways to reference nested fields in the template - so best for us to flatten.
                      This way e.g. `!GetAtt MyDeployment.StackName.MyStackOutput` will work.
                      """
                      items = []
                      for key, value in d.items():
                          new_key = sep.join((parent_key, key)) if parent_key else key
                          if isinstance(value, dict):
                              items.extend(flatten(value, new_key, sep=sep).items())
                          else:
                              items.append((new_key, value))
                      return dict(items)

                  if not resp_url:
                      print("No CloudFormation response URL provided")
                      exit(0)
                  try:
                      data = json.loads(os.environ["CFN_EVENT_DATA"])
                      if int(os.environ["CODEBUILD_BUILD_SUCCEEDING"]):
                          data["Status"] = "SUCCESS"
                          try:
                              # Pass CDK deploy outputs as attributes of this CFn resource:
                              with open("cdk.outputs.json") as fouts:
                                  outputs = json.load(fouts)
                                  data["Data"] = flatten(outputs)
                          except FileNotFoundError:
                              print(
                                  "No cdk.outputs.json found: Have your deploy job create this "
                                  "file if you want to pass outputs back to the bootstrap stack."
                              )
                      else:
                          data["Status"] = "FAILED"
                      build_arn = os.environ["CODEBUILD_BUILD_ARN"]
                      data["Reason"] = "See details in CloudWatch Log Stream /aws/codebuild/" + (
                          build_arn.partition("/")[2]
                      )
                      response = requests.put(resp_url, data=json.dumps(data))
                      print(f"Notified CloudFormation of {data['Status']}")
                  except Exception as e:
                      print(f"Failed to send response to CloudFormation event handler")
                      raise e
                  EOS
        SourceIdentifier: coderepo
        Type: NO_SOURCE
      TimeoutInMinutes: 60

  # Creating a CodeBuild project in CloudFormation doesn't automatically start a build, so below we
  # set up an AWS Lambda Function based Custom Resource to trigger the build whenever the stack is
  # created or updated:

  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Condition: LangfuseEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole' # (CloudWatch Logs)
      Policies:
        - PolicyName: RunCodeBuildProject
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - "codebuild:StartBuild"
                Resource:
                  - !GetAtt CodeBuildProject.Arn

  CodeBuildTriggerFunction:
    Type: "AWS::Lambda::Function"
    Condition: LangfuseEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "IAM will authorize access to this rarely-used function: No need to put in VPC"
          - id: W92
            reason: "Only to be invoked by CREATE/UPDATE/DELETE CFN events for this stack: no reserved concurrency required"
    Properties:
      Description: "CloudFormation custom resource implementation for running CodeBuild project"
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          """Custom CloudFormation Resource to kick off CodeBuild project builds

          CFn Properties
          --------------
          ProjectName : string
              Name of the AWS CodeBuild project to run
          BuildOnDelete : Optional[bool]
              Set `True` to also run a build on CloudFormation `Delete` events (i.e. if your CodeBuild
              script will detect that `CFN_EVENT_TYPE` is `Delete` and destroy its resources)
          CodeBuildCallback : Optional[bool]
              Set `True` if your CodeBuild project will handle the CloudFormation CR callback, or leave
              default (False) to report success as soon as the build is triggered.
          IgnoreUpdate : Optional[bool]
              Set `True` to only trigger a build on initial `Create` events and ignore subsequent `Update`s

          CodeBuild Env Var Overrides
          ---------------------------
          CFN_EVENT_TYPE : Union["Create", "Update", "Delete"]
              Type of CloudFormation event that triggered the build
          CFN_EVENT_DATA : str
              JSON object containing LogicalResourceId, RequestId, StackId, NoEcho, and (empty) Data that
              your CodeBuild should post back to CloudFormation on completion/failure (when provided). Note
              your build project will need to add the `Status`, `Reason`, and `PhysicalResourceId` fields.
          CFN_EVENT_RESPONSE_URL : str
              URL to which the CloudFormation response data should be `PUT` (if provided)
          """

          # Python Built-Ins:
          import json
          import logging
          import traceback

          # External Dependencies:
          import boto3
          import cfnresponse

          codebuild = boto3.client("codebuild")

          def lambda_handler(event, context):
              try:
                  request_type = event["RequestType"]
                  if request_type == "Create":
                      handle_create(event, context)
                  elif request_type == "Update":
                      handle_update(event, context)
                  elif request_type == "Delete":
                      handle_delete(event, context)
                  else:
                      cfnresponse.send(
                          event,
                          context,
                          cfnresponse.FAILED,
                          {},
                          reason=f"Unsupported CFN RequestType '{request_type}'",
                      )
              except Exception as e:
                  logging.error("Uncaught exception in CFN custom resource handler - reporting failure")
                  traceback.print_exc()
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.FAILED,
                      {},
                      reason=f"See CloudWatch {context.log_group_name} > {context.log_stream_name} - {str(e)}",
                  )
                  raise e


          def get_cfn_env_var_overrides(event):
              res_config = event.get("ResourceProperties", {})
              result = [
                  {"name": "CFN_EVENT_TYPE", "type": "PLAINTEXT", "value": event["RequestType"]},
              ]
              if res_config.get("CodeBuildCallback"):
                  result += [
                      {
                          "name": "CFN_EVENT_DATA",
                          "type": "PLAINTEXT",
                          "value": json.dumps({
                              "LogicalResourceId": event["LogicalResourceId"],
                              "PhysicalResourceId": event["LogicalResourceId"],
                              "RequestId": event["RequestId"],
                              "StackId": event["StackId"],
                              "NoEcho": event["ResourceProperties"].get("NoEcho", False),
                              "Data": {},
                          }),
                      },
                      {
                          "name": "CFN_EVENT_RESPONSE_URL",
                          "type": "PLAINTEXT",
                          "value": event["ResponseURL"],
                      },
                  ]
              return result


          def handle_create(event, context):
              logging.info("**Received create request - running CodeBuild job")
              res_config = event["ResourceProperties"]
              codebuild_env_vars = get_cfn_env_var_overrides(event)
              result = codebuild.start_build(
                  projectName=res_config["ProjectName"],
                  environmentVariablesOverride=codebuild_env_vars,
              )
              if not res_config.get("CodeBuildCallback"):
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      { "Reason": f"Started CodeBuild #{result['build']['buildNumber']}" },
                      # Changing physical ID would look like a 'replacement' to CloudFormation,
                      # causing it to send a delete/CDK destroy request to the old physical ID
                      # after running CDK deploy on the new one - which is pretty much never what
                      # we want.
                      physicalResourceId=event["LogicalResourceId"],
                  )

          def handle_delete(event, context):
              logging.info("**Received delete event - no-op")
              res_config = event.get("ResourceProperties", {})
              build_on_delete = res_config.get("BuildOnDelete", False)
              if build_on_delete:
                  codebuild_env_vars = get_cfn_env_var_overrides(event)
                  codebuild.start_build(
                      projectName=res_config["ProjectName"],
                      environmentVariablesOverride=codebuild_env_vars,
                  )
                  reason = "Deletion build initiated"
              else:
                  reason = "Delete is a no-op"
              if not (build_on_delete and res_config.get("CodeBuildCallback")):
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      { "Reason": reason },
                      physicalResourceId=event["PhysicalResourceId"],
                  )

          def handle_update(event, context):
              logging.info("**Received update event - re-running build")
              res_config = event.get("ResourceProperties", {})
              ignore_update = res_config.get("IgnoreUpdate", False)
              if ignore_update:
                  reason = "Update is a no-op"
              else:
                  codebuild_env_vars = get_cfn_env_var_overrides(event)
                  result = codebuild.start_build(
                      projectName=res_config["ProjectName"],
                      environmentVariablesOverride=codebuild_env_vars,
                  )
                  if res_config.get("CodeBuildCallback"):
                      reason = None
                  else:
                      reason = f"Started CodeBuild #{result['build']['buildNumber']}"
              if reason is not None:
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      { "Reason": reason },
                      physicalResourceId=event["PhysicalResourceId"],
                  )

      Handler: "index.lambda_handler"
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 900

  # IF you enable CodeBuildCallback AND your deployment script creates 'cdk.outputs.json', the
  # contents should be passed through as output attributes on this CFn resource to use how you want
  # For example, re-exposing them as outputs of this CFn bootstrap stack) with a reference like:
  #     !GetAtt SampleDeployment.MyStackName.SomeOutput
  SampleDeployment:
    Type: "Custom::CodeBuildTrigger"
    Condition: LangfuseEnabled
    Properties:
      ServiceToken: !GetAtt CodeBuildTriggerFunction.Arn
      ProjectName: !Ref CodeBuildProject
      BuildOnDelete: true
      # NOTE: If CDK deployment takes longer than 1 hour, this CodeBuild-based callback to
      # CloudFormation *will not work* because CFn will time out. In that case can comment out /
      # unset `CodeBuildCallback`, and the bootstrap stack will "succeed" as soon as the CodeBuild
      # job is triggered, without waiting for it to complete.
      CodeBuildCallback: true
      # Project configuration changes alone do not update this custom resource. Include the
      # deployment inputs so a source/image/asset/auth update also triggers the build callback.
      DeploymentParameters:
        AuthType: !Ref AuthType
        ClickHouseContainerImage: !Ref ClickHouseContainerImage
        LangfuseWebContainerImage: !Ref LangfuseWebContainerImage
        LangfuseWorkerContainerImage: !Ref LangfuseWorkerContainerImage
        CodeRepo: !Ref CodeRepo
        CodeRepoBranch: !Ref CodeRepoBranch
        CodeRepoFolder: !Ref CodeRepoFolder
        AssetsBucketName: !Ref AssetsBucketName
        AssetsBucketPrefix: !Ref AssetsBucketPrefix
        ClickHouseArchiveSha256: !Ref ClickHouseArchiveSha256

  # ========== Langfuse User Provisioning ==========
  # Creates an admin user in the Langfuse Cognito User Pool after CDK deployment

  LangfuseUserPassword:
    Type: AWS::SecretsManager::Secret
    Condition: LangfuseCognitoEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: Default KMS key is appropriate for this workshop password
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${AWS::StackName}-langfuse-user-password'
      Description: Password for Langfuse workshop admin user
      GenerateSecretString:
        PasswordLength: 16
        ExcludePunctuation: false
        ExcludeCharacters: '"''`\/@ '
        IncludeSpace: false
        RequireEachIncludedType: true

  LangfuseUserProvisioningRole:
    Type: AWS::IAM::Role
    Condition: LangfuseCognitoEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CognitoAdminAccess
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                Resource: '*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref LangfuseUserPassword

  LangfuseUserProvisioningFunction:
    Type: AWS::Lambda::Function
    Condition: LangfuseCognitoEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: IAM authorizes access; no need for VPC
          - id: W92
            reason: Invoked only during CFN events; no reserved concurrency required
    Properties:
      Description: Provisions Langfuse admin user in Cognito User Pool
      Handler: index.handler
      Role: !GetAtt LangfuseUserProvisioningRole.Arn
      Runtime: python3.11
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json

          cognito = boto3.client('cognito-idp')
          secrets = boto3.client('secretsmanager')

          def handler(event, context):
              print(f"Event: {json.dumps(event)}")
              request_type = event['RequestType']
              props = event['ResourceProperties']

              user_pool_id = props['UserPoolId']
              username = props['Username']
              email = props.get('Email', username)
              secret_arn = props['PasswordSecretArn']

              try:
                  if request_type == 'Delete':
                      try:
                          cognito.admin_delete_user(
                              UserPoolId=user_pool_id,
                              Username=username
                          )
                          print(f"Deleted user {username}")
                      except cognito.exceptions.UserNotFoundException:
                          print(f"User {username} not found, skipping deletion")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  # Get password from Secrets Manager
                  secret_response = secrets.get_secret_value(SecretId=secret_arn)
                  password = secret_response['SecretString']

                  # Check if user exists
                  user_exists = False
                  try:
                      cognito.admin_get_user(
                          UserPoolId=user_pool_id,
                          Username=username
                      )
                      user_exists = True
                      print(f"User {username} already exists")
                  except cognito.exceptions.UserNotFoundException:
                      print(f"User {username} does not exist, will create")

                  if not user_exists:
                      cognito.admin_create_user(
                          UserPoolId=user_pool_id,
                          Username=username,
                          UserAttributes=[
                              {'Name': 'email', 'Value': email},
                              {'Name': 'email_verified', 'Value': 'true'}
                          ],
                          MessageAction='SUPPRESS'
                      )
                      print(f"Created user {username} with email {email}")

                  # Set permanent password
                  cognito.admin_set_user_password(
                      UserPoolId=user_pool_id,
                      Username=username,
                      Password=password,
                      Permanent=True
                  )
                  print(f"Set permanent password for {username}")

                  # Return email as the login username (since pool uses email alias)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'Username': email,
                      'Password': password
                  })

              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })

  LangfuseUserProvisioningResource:
    Type: Custom::LangfuseUserProvisioning
    Condition: LangfuseCognitoEnabled
    Properties:
      ServiceToken: !GetAtt LangfuseUserProvisioningFunction.Arn
      UserPoolId: !GetAtt SampleDeployment.LangfuseDemo.CognitoUserPoolId
      Username: workshop-admin
      Email: workshop-admin@example.com
      PasswordSecretArn: !Ref LangfuseUserPassword

Outputs:
  CodeBuildProjectArn:
    Description: ARN of the deployment project, or DISABLED
    Value: !If [LangfuseEnabled, !GetAtt CodeBuildProject.Arn, 'DISABLED']
  CodeBuildProjectName:
    Description: Name of the deployment project, or DISABLED
    Value: !If [LangfuseEnabled, !Ref CodeBuildProject, 'DISABLED']
  CodeBuildConsoleLink:
    Description: Link to project in AWS CodeBuild Console, or DISABLED
    Value: !If
      - LangfuseEnabled
      - !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/${AWS::AccountId}/projects/${CodeBuildProject}"
      - 'DISABLED'
  LangfuseUrl:
    Description: Link to deployed Langfuse service, or DISABLED
    Value: !If [LangfuseEnabled, !GetAtt SampleDeployment.LangfuseDemo.LangfuseUrl, 'DISABLED']
  LangfuseUsername:
    Description: Login email, NOT_APPLICABLE for native auth, or DISABLED
    Value: !If
      - LangfuseCognitoEnabled
      - !GetAtt LangfuseUserProvisioningResource.Username
      - !If [LangfuseEnabled, 'NOT_APPLICABLE', 'DISABLED']
  LangfusePassword:
    Description: Login password, NOT_APPLICABLE for native auth, or DISABLED
    Value: !If
      - LangfuseCognitoEnabled
      - !GetAtt LangfuseUserProvisioningResource.Password
      - !If [LangfuseEnabled, 'NOT_APPLICABLE', 'DISABLED']
