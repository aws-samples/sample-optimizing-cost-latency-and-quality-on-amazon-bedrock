  KnowledgeBaseSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt 'KnowledgeBaseSetupRole.Arn'
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          import hashlib
          import time
          import boto3
          import cfnresponse
          from botocore.config import Config
          from botocore.exceptions import ClientError

          def ingest(event, context):
              props = event['ResourceProperties']
              client = boto3.client('bedrock-agent', config=Config(
                  connect_timeout=5, read_timeout=20, retries={'max_attempts': 3, 'mode': 'standard'}))
              ids = {'knowledgeBaseId': props['KnowledgeBaseId'], 'dataSourceId': props['DataSourceId']}
              # Retries of the same CFN request reuse a job. Updates start a new sync.
              token = hashlib.sha256((event['StackId'] + event['RequestId']).encode()).hexdigest()
              deadline = time.monotonic() + min(780, context.get_remaining_time_in_millis() / 1000 - 45)
              while time.monotonic() < deadline:
                  try:
                      job = client.start_ingestion_job(**ids, clientToken=token)['ingestionJob']
                  except ClientError as error:
                      if error.response['Error']['Code'] != 'ConflictException':
                          raise
                      # Wait out an existing sync; do not adopt its success for our changed data.
                      time.sleep(5)
                      continue
                  break
              else:
                  raise TimeoutError('Timed out starting knowledge base ingestion')
              while time.monotonic() < deadline:
                  job = client.get_ingestion_job(**ids, ingestionJobId=job['ingestionJobId'])['ingestionJob']
                  status = job['status']
                  if status == 'COMPLETE':
                      if job.get('statistics', {}).get('numberOfDocumentsFailed', 0):
                          raise RuntimeError('Ingestion completed with failed documents: ' + str(job))
                      return {'Status': 'SUCCESS', 'IngestionStatus': status,
                              'KnowledgeBaseId': props['KnowledgeBaseId'], 'DataSourceId': props['DataSourceId'],
                              'FilesUploaded': props['FilesUploaded'], 'Error': 'none'}
                  if status in ('FAILED', 'STOPPED', 'STOPPING'):
                      raise RuntimeError('Ingestion ' + status + ': ' + str(job.get('failureReasons', [])))
                  time.sleep(5)
              # Cancel only the job started by this request, so rollback can delete
              # the native data source without leaving an active ingestion behind.
              client.stop_ingestion_job(**ids, ingestionJobId=job['ingestionJobId'])
              raise TimeoutError('Knowledge base ingestion did not complete before the callback deadline; stop requested')

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              try:
                  if event['RequestType'] == 'Delete':
                      # Native DataSource (DELETE), KB and optional vector index own teardown.
                      data = {'Status': 'DELETED'}
                  else:
                      data = ingest(event, context)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data, physical_id)
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {'Status': 'FAILED', 'Error': str(error)[:1000]}, physical_id)
      Layers:
      - !Ref 'Boto3Layer'

