          - Effect: Allow
            Action:
            - logs:DescribeResourcePolicies
            - logs:PutResourcePolicy
            Resource: '*'
          # UpdateTraceSegmentDestination creates/configures these service log groups
          # using the caller's permissions when Transaction Search is first enabled.
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutRetentionPolicy
            Resource:
            - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans'
            - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*'
            - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data'
            - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*'
          - Effect: Allow
            Action: application-signals:StartDiscovery
            Resource: '*'
          - Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/application-signals.cloudwatch.amazonaws.com/AWSServiceRoleForCloudWatchApplicationSignals'
            Condition:
              StringEquals:
                iam:AWSServiceName: application-signals.cloudwatch.amazonaws.com
          - Effect: Allow
            Action: iam:GetRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/application-signals.cloudwatch.amazonaws.com/AWSServiceRoleForCloudWatchApplicationSignals'
          - Effect: Allow
            Action: cloudtrail:CreateServiceLinkedChannel
            Resource: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:channel/aws-service-channel/application-signals/*'
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  TransactionSearchSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt 'TransactionSearchSetupRole.Arn'
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          import json
          import time
          import boto3
          import cfnresponse
          from botocore.config import Config

          POLICY_NAME = 'TransactionSearchXRayAccess'

          def enable(event, context):
              config = Config(connect_timeout=5, read_timeout=20, retries={'max_attempts': 3, 'mode': 'standard'})
              xray = boto3.client('xray', config=config)
              state = xray.get_trace_segment_destination()
              preserved = state.get('Destination') == 'CloudWatchLogs'
              if not preserved:
                  logs = boto3.client('logs', config=config)
                  policies, token = [], None
                  while True:
                      page = logs.describe_resource_policies(**({'nextToken': token} if token else {}))
                      policies.extend(page.get('resourcePolicies', []))
                      token = page.get('nextToken')
                      if not token:
                          break
                  # Never replace a customer's existing policy, even when TS is currently off.
                  if not any(p['policyName'] == POLICY_NAME for p in policies):
                      arn_parts = context.invoked_function_arn.split(':')
                      partition, region, account = arn_parts[1], arn_parts[3], arn_parts[4]
                      prefix = f'arn:{partition}:logs:{region}:{account}:log-group:'
                      policy = {'Version': '2012-10-17', 'Statement': [{
                          'Effect': 'Allow', 'Principal': {'Service': 'xray.amazonaws.com'},
                          'Action': 'logs:PutLogEvents',
                          'Resource': [prefix + 'aws/spans:*', prefix + '/aws/application-signals/data:*'],
                          'Condition': {'StringEquals': {'aws:SourceAccount': account},
                                        'ArnLike': {'aws:SourceArn': f'arn:{partition}:xray:{region}:{account}:*'}}}]}
                      logs.put_resource_policy(policyName=POLICY_NAME, policyDocument=json.dumps(policy))
                  # Do not alter the account's indexing percentage or other logging configuration.
                  xray.update_trace_segment_destination(Destination='CloudWatchLogs')
              # First-time activation can take ten minutes; preserve callback time.
              deadline = time.monotonic() + min(720, context.get_remaining_time_in_millis() / 1000 - 45)
              while time.monotonic() < deadline:
                  state = xray.get_trace_segment_destination()
                  if state.get('Destination') == 'CloudWatchLogs' and state.get('Status') == 'ACTIVE':
                      return {'AlreadyEnabled': preserved, 'Destination': 'CloudWatchLogs', 'Status': 'ACTIVE'}
                  if state.get('Status') == 'FAILED':
                      raise RuntimeError('Transaction Search activation failed')
                  time.sleep(5)
              raise TimeoutError('Transaction Search did not become ACTIVE before the callback deadline')

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              try:
                  data = {'Status': 'PRESERVED'} if event['RequestType'] == 'Delete' else enable(event, context)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data, physical_id)
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {'Error': str(error)[:1000]}, physical_id)
      Layers:
      - !Ref 'Boto3Layer'

  TransactionSearchSetup:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt 'TransactionSearchSetupFunction.Arn'
      Revision: '2026-09-24'


