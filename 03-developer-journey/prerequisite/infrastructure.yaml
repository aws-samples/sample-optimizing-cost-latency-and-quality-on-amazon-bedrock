    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: WorkshopAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetBucketTagging
            - s3:ListBucket
            - s3:ListBucketVersions
            - s3:ListBucketMultipartUploads
            Resource:
            - !GetAtt 'LambdaCodeBucket.Arn'
            - !GetAtt 'BedrockKnowledgeBaseDataBucket.Arn'
            - !GetAtt 'PlaybookKbDataBucket.Arn'
            - !GetAtt 'PlaybookBatchBucket.Arn'
