            Resource:
            - !Sub '${LambdaCodeBucket.Arn}/*'
            - !Sub '${BedrockKnowledgeBaseDataBucket.Arn}/*'
            - !Sub '${PlaybookKbDataBucket.Arn}/*'
            - !Sub '${PlaybookBatchBucket.Arn}/*'
            - !Sub '${AgentCoreCodeBucket.Arn}/*'
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  WorkshopBucketCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt 'WorkshopBucketCleanupRole.Arn'
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          from botocore.config import Config
          from botocore.exceptions import ClientError

          def empty_bucket(s3, bucket, stack_id, context):
              try:
                  tags = {t['Key']: t['Value'] for t in s3.get_bucket_tagging(Bucket=bucket)['TagSet']}
              except ClientError as error:
                  if error.response['Error']['Code'] == 'NoSuchBucket':
                      return
                  raise
              if tags.get('WorkshopStack') != stack_id:
                  raise ValueError('Refusing to empty bucket without this stack ownership tag: ' + bucket)
              # ListObjectVersions includes unversioned objects (VersionId=null), historical
              # versions and delete markers. Check partial DeleteObjects errors explicitly.
              for page in s3.get_paginator('list_object_versions').paginate(Bucket=bucket):
                  if context.get_remaining_time_in_millis() < 45000:
                      raise TimeoutError('Bucket cleanup timed out; retry stack deletion')
                  objects = [{'Key': obj['Key'], 'VersionId': obj['VersionId']}
                             for kind in ('Versions', 'DeleteMarkers') for obj in page.get(kind, [])]
                  for offset in range(0, len(objects), 1000):
                      result = s3.delete_objects(Bucket=bucket, Delete={'Objects': objects[offset:offset+1000], 'Quiet': True})
                      if result.get('Errors'):
                          raise RuntimeError('S3 deletion failed: ' + str(result['Errors']))
              for page in s3.get_paginator('list_multipart_uploads').paginate(Bucket=bucket):
                  for upload in page.get('Uploads', []):
                      s3.abort_multipart_upload(Bucket=bucket, Key=upload['Key'], UploadId=upload['UploadId'])

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              try:
                  if event['RequestType'] == 'Delete':
                      s3 = boto3.client('s3', config=Config(connect_timeout=5, read_timeout=20,
                          retries={'max_attempts': 3, 'mode': 'standard'}))
                      for bucket in event['ResourceProperties']['BucketNames']:
                          empty_bucket(s3, bucket, event['StackId'], context)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {'Error': str(error)[:1000]}, physical_id)

