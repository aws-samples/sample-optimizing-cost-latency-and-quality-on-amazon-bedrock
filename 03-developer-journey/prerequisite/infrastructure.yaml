  # IAM Role for Lambda function
  PopulateDataRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt WarrantyTable.Arn
                  - !GetAtt CustomerProfileTable.Arn
        - PolicyName: AllowBasicLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:PutDeliverySource
                Resource: arn:aws:logs:*:*:*
  # Custom resource to trigger Lambda function
  PopulateData:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PopulateDataFunction.Arn
      WarrantyTableName: !Ref WarrantyTable
      CustomerTableName: !Ref CustomerProfileTable
  
  # Lambda target
  CustomerSupportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
      Policies:
      - PolicyName: KnowledgeBaseToolAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ReadKnowledgeBaseConfiguration
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
            - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/customersupport/kb/type'
            - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::AccountId}-${AWS::Region}/kb/knowledge-base-id'
          - Sid: RetrieveWorkshopKnowledgeBase
            Effect: Allow
            Action: bedrock:Retrieve
            Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
      - PolicyName: CustomerProfileAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: AllowReadCustomerTableNameFromSSM
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CustomerProfileTableNameParameter}'
          - Sid: AllowReadCustomerProfileTable
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:DescribeTable
            Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerProfileTable}'
          - Sid: AllowReadCustomerTableIndexes
            Effect: Allow
            Action:
            - dynamodb:Query
            Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerProfileTable}/index/*'
      - PolicyName: WarrantyCheckAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: AllowReadWarrantyTableNameFromSSM
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WarrantyTableNameParameter}'
          - Sid: AllowReadWarrantyTable
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:DescribeTable
            Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WarrantyTable}'

  DDGSLayer:
    Type: AWS::Lambda::LayerVersion
    DependsOn: LambdaCodeSetup
    Properties:
      LayerName: !Sub '${AWS::StackName}-ddgs-layer'
      Description: DDGS package for Lambda functions
      Content:
        S3Bucket: !Ref 'LambdaCodeBucket'
        S3Key: ddgs-layer.zip
      CompatibleRuntimes:
      - python3.12
      CompatibleArchitectures:
      - x86_64
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  CustomerSupportLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: 'Lambda function for Customer Support Assistant'
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !GetAtt 'LambdaCodeSetup.LambdaS3Key'
      Role: !GetAtt CustomerSupportLambdaRole.Arn
      Runtime: python3.12
      Timeout: 30
      MemorySize: 512
      PackageType: Zip
      Architectures:
        - x86_64
      Layers:
        - !Ref DDGSLayer
        - !Ref Boto3Layer
      Environment:
        Variables:
          PYTHONPATH: /opt/python

  
# SSM Parameter to store warranty table name
  WarrantyTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/dynamodb/warranty_table_name
      Type: String
      Value: !Ref WarrantyTable
      Description: DynamoDB table name for warranty information
      Tags:
        Application: CustomerSupport

  # SSM Parameter to store customer profile table name
  CustomerProfileTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/dynamodb/customer_profile_table_name
      Type: String
      Value: !Ref CustomerProfileTable
      Description: DynamoDB table name for customer profiles
      Tags:
        Application: CustomerSupport

  GatewayAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/gateway_iam_role
      Type: String
      Value: !GetAtt GatewayAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: CustomerSupport

  RuntimeAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/runtime_iam_role
      Type: String
      Value: !GetAtt RuntimeAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: CustomerSupport

  LambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/lambda_arn
      Type: String
      Value: !GetAtt CustomerSupportLambda.Arn
      Description: ARN of the lambda that integrates with agentcore
      Tags:
        Application: CustomerSupport

  # S3 Bucket for knowledge base documents
  BedrockKnowledgeBaseDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::AccountId}-${AWS::Region}-kb-data-bucket'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

  Boto3Layer:
    Type: AWS::Lambda::LayerVersion
    DependsOn: Boto3LayerBuild
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Workshop boto3/botocore 1.43.101 (Python 3.12)
      Content:
        S3Bucket: !Ref 'LambdaCodeBucket'
        S3Key: boto3-1.43.101-py312.zip
      CompatibleRuntimes:
      - python3.12
      CompatibleArchitectures:
      - x86_64

  Boto3LayerCreator:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt 'Boto3LayerCreatorRole.Arn'
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile
          import boto3
          import cfnresponse

          def handler(event, context):
              physical_id = event.get('PhysicalResourceId', event['LogicalResourceId'])
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                      return
                  props = event['ResourceProperties']
                  with tempfile.TemporaryDirectory() as directory:
                      target = os.path.join(directory, 'python')
                      subprocess.check_call([
                          sys.executable, '-m', 'pip', 'install',
                          'boto3==' + props['Boto3Version'], 'botocore==' + props['BotocoreVersion'],
                          '--target', target, '--no-cache-dir',
                      ], timeout=600)
                      archive = os.path.join(directory, 'layer.zip')
                      with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
                          for root, _, files in os.walk(target):
                              for name in sorted(files):
                                  filename = os.path.join(root, name)
                                  output.write(filename, os.path.relpath(filename, directory))
                      boto3.client('s3').upload_file(archive, props['BucketName'], props['ObjectKey'])
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {'Error': str(error)[:1000]}, physical_id)

