                      # check_warranty.py
                      zf.writestr('check_warranty.py', '''import boto3
          import json
          from datetime import datetime
          from botocore.exceptions import ClientError
          import logging
          import re

          logging.basicConfig(format="[%(asctime)s] p%(process)s {%(filename)s:%(lineno)d} %(levelname)s - %(message)s", level=logging.INFO)
          logger = logging.getLogger(__name__)

          dynamodb = boto3.resource("dynamodb")
          smm_client = boto3.client("ssm")

          warranty_table = smm_client.get_parameter(Name="/app/customersupport/dynamodb/warranty_table_name", WithDecryption=False)
          warranty_table_name = warranty_table["Parameter"]["Value"]


          def ensure_warranty_table_exists():
              try:
                  table = dynamodb.Table(warranty_table_name)
                  table.load()
                  return table
              except ClientError as e:
                  raise e


          def validate_serial_number(serial_number: str) -> bool:
              pattern = r"^[A-Z0-9]{8,20}$"
              return bool(re.match(pattern, serial_number.upper()))


          def calculate_days_remaining(end_date: str) -> int:
              try:
                  end_date_obj = datetime.strptime(end_date, "%Y-%m-%d")
                  today = datetime.now()
                  delta = end_date_obj - today
                  return delta.days
              except ValueError:
                  return 0


          def get_warranty_status_text(days_remaining: int) -> str:
              if days_remaining > 30:
                  return "Active"
              elif days_remaining > 0:
                  return "Expiring Soon"
              else:
                  return "Expired"


          def check_warranty_status(serial_number: str, customer_email: str = None) -> str:
              logger.info(json.dumps({"serial_number": serial_number, "customer_email": customer_email, "timestamp": datetime.now().isoformat()}, indent=2, default=str))

              if not validate_serial_number(serial_number):
                  raise ValueError("Serial number must be 8-20 alphanumeric characters")

              serial_number = serial_number.upper()

              try:
                  table = ensure_warranty_table_exists()
                  response = table.get_item(Key={"serial_number": serial_number})

                  if "Item" not in response:
                      return f"Warranty Not Found for Serial Number: {serial_number}"

                  warranty_item = response["Item"]
                  product_name = warranty_item.get("product_name", "Unknown Product")
                  purchase_date = warranty_item.get("purchase_date", "Unknown")
                  warranty_end_date = warranty_item.get("warranty_end_date", "Unknown")
                  warranty_type = warranty_item.get("warranty_type", "Standard")
                  customer_name = warranty_item.get("customer_name", "Unknown")
                  coverage_details = warranty_item.get("coverage_details", "Standard coverage applies")

                  days_remaining = calculate_days_remaining(warranty_end_date) if warranty_end_date != "Unknown" else 0
                  status_text = get_warranty_status_text(days_remaining)

                  warranty_info = [
                      "Warranty Status Information",
                      "===============================",
                      f"Product: {product_name}",
                      f"Serial Number: {serial_number}",
                      f"Customer: {customer_name}",
                      f"Purchase Date: {purchase_date}",
                      f"Warranty End Date: {warranty_end_date}",
                      f"Warranty Type: {warranty_type}",
                      f"Status: {status_text}",
                      f"Days Remaining: {days_remaining}",
                      f"Coverage Details: {coverage_details}",
                  ]

                  logger.info(json.dumps(warranty_item, indent=2, default=str))
                  return "\\n".join(warranty_info)

              except ClientError as e:
                  logger.error("DynamoDB Error:", e)
                  raise Exception(f"Failed to check warranty status: {e.response['Error']['Message']}")
              except Exception as e:
                  logger.error("Unexpected Error:", str(e))
                  raise Exception(f"Failed to check warranty status: {str(e)}")
          ''')

                      # web_search.py
                      zf.writestr('web_search.py', '''from ddgs import DDGS


          def web_search(keywords: str, region: str = "us-en", max_results: int = 5) -> str:
              try:
                  results = DDGS().text(keywords, region=region, max_results=max_results)
                  return results if results else "No results found."
              except Exception as e:
                  return f"Search error: {str(e)}"
          ''')

                  lambda_code.seek(0)
                  s3.put_object(Bucket=bucket_name, Key=lambda_key, Body=lambda_code.read())
                  print(f"Uploaded {lambda_key}")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'LambdaS3Key': lambda_key,
                      'LayerS3Key': 'ddgs-layer.zip'
                  }, physicalResourceId=event.get('PhysicalResourceId') or f'{bucket_name}-lambda-code')

              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # Trigger Lambda Code Setup
  LambdaCodeSetup:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: WorkshopBucketCleanup
    Properties:
      ServiceToken: !GetAtt 'LambdaCodeSetupFunction.Arn'
      BucketName: !Ref 'LambdaCodeBucket'
      # Bump for bootstrap code changes: rerun setup and change the Lambda Code S3 key.
      ArtifactRevision: high-readonly-v1

  RuntimeAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock-agentcore.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: BedrockAgentPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:DescribeLogStreams
            - logs:CreateLogGroup
            Resource:
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
          - Effect: Allow
            Action:
            - logs:DescribeLogGroups
            Resource: '*'
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
          - Effect: Allow
            Action:
            - xray:PutSpans
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            - xray:GetSamplingRules
            - xray:GetSamplingTargets
            Resource: '*'
          - Effect: Allow
            Action:
            - cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore
          - Sid: GetAgentAccessToken
            Effect: Allow
            Action:
            - bedrock-agentcore:GetWorkloadAccessToken
            - bedrock-agentcore:GetWorkloadAccessTokenForJWT
            - bedrock-agentcore:GetWorkloadAccessTokenForUserId
            Resource:
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/customersupport*'
          - Sid: ProvisionedThroughputModelInvocation
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            Resource:
            - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
            - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
            - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*'
          - Sid: SSMGetparam
            Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/customersupport/*'
            - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::AccountId}-${AWS::Region}/kb/*'
            - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::AccountId}-${AWS::Region}/playbook-kb/*'
          - Sid: Identity
            Effect: Allow
            Action:
            - bedrock-agentcore:GetResourceOauth2Token
            Resource:
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/customersupport*'
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/customersupport*'
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default'
          - Sid: SecretManager
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/oauth2/customersupport*'
          - Sid: AgentCoreMemory
            Effect: Allow
            Action:
            - bedrock-agentcore:ListMemories
            - bedrock-agentcore:ListMemoryRecords
            - bedrock-agentcore:RetrieveMemoryRecords
            - bedrock-agentcore:GetMemory
            - bedrock-agentcore:GetMemoryRecord
            - bedrock-agentcore:CreateEvent
            - bedrock-agentcore:GetEvent
            Resource:
            - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/customersupport*'
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource: !Sub '${AgentCoreCodeBucket.Arn}/*'
            Sid: ReadRuntimeCode
          - Effect: Allow
            Action:
            - bedrock-agentcore:GetConfigurationBundle
            - bedrock-agentcore:GetConfigurationBundleVersion
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:configuration-bundle/*'
            Sid: ReadConfigurationBundles
          - Effect: Allow
            Action:
            - bedrock-mantle:CreateInference
            Resource: '*'
            Sid: MantleInference
          - Effect: Allow
            Action:
            - bedrock:Retrieve
            Resource:
            - !GetAtt 'KnowledgeBase.KnowledgeBaseArn'
            - !GetAtt 'PlaybookKnowledgeBase.KnowledgeBaseArn'
            Sid: RetrieveWorkshopKnowledge
          - Effect: Allow
            Action:
            - bedrock:ApplyGuardrail
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
            Sid: ApplyWorkshopGuardrails
          - Effect: Allow
            Action:
            - bedrock:InvokeGuardrailChecks
            Resource: '*'
            Sid: DetectGuardrailChecks
      RoleName: !Sub 'techmart-runtime-${AWS::Region}'
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'

  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock-agentcore.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: BedrockAgentPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: InvokeFunction
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - !GetAtt 'CustomerSupportLambda.Arn'
          - Effect: Allow
            Action:
            - bedrock-agentcore:InvokeAgentRuntime
            Resource:
            - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/customersupport*'
            - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/techmart*'
            Sid: InvokeWorkshopRuntime
          - Sid: ReadWorkshopBundleVersion
            Effect: Allow
            Action: bedrock-agentcore:GetConfigurationBundleVersion
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:configuration-bundle/WorkshopPrompt*'
      RoleName: !Sub 'techmart-gateway-${AWS::Region}'
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'

  WarrantyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serial_number
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: serial_number
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: CostCenter
          Value: CustomerSupport

  # DynamoDB Table for Customer Profiles
  CustomerProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: CostCenter
          Value: CustomerSupport

