AWSTemplateFormatVersion: '2010-09-09'
Description: 'Customer support workshop: native knowledge bases, AgentCore roles and gateway, observability, and sample data'

# Native KB/DataSource resources own their lifecycle through CloudFormation.
# Developer Journey uses Managed KB; Playbook retains S3 Vectors for its tuning labs.
# Targets, online evaluations, bundles and A/B jobs follow notebook Runtime deployment.
# Existing custom-resource stacks require the staged migration described below.
Metadata:
  RuntimeGatewayContract:
    VerifiedOn: '2026-09-24'
    Source: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-http-runtime.html
    Protocol: HTTP Runtime targets require ProtocolType to be omitted.
  ManagedKnowledgeBaseContract:
    VerifiedOn: '2026-09-24'
    SchemaRegion: us-east-1
    SchemaReadOperation: cloudformation:DescribeType
    Sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-create.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-s3.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-connect-ds.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sync.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-customize-ingestion.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-prereqs.html
    Connector: >-
      ConnectorParameters is an opaque JSON object in the CFN schema. Its keys
      must remain lower camel case: type=S3, version="1",
      connectionConfiguration.bucketName and bucketOwnerAccountId.
      DeletionProtectionConfiguration is a typed sibling outside that object.
    Ingestion: >-
      Both KB types use bedrock-agent StartIngestionJob, GetIngestionJob and
      StopIngestionJob. Native CFN resources stabilize the KB and data source;
      the shared custom resource uploads nothing and only syncs their exact IDs.
      Managed parsing defaults to SMART_PARSING. With managed embeddings the
      service controls chunking; omit ChunkingConfiguration. Rebaseline retrieval
      after migration instead of assuming the old 200-token chunks remain.
      No recurring sync schedule or custom embedding-model access is required.
  WorkshopMigration:
    FreshInstall: >-
      Deploy this template in a clean environment. Native resources own the KBs,
      sources, vector storage, memory and layer versions. SSM IDs and KB type are
      published only after successful ingestion. Do not apply this template
      directly to a stack that still uses the legacy provisioning handlers.
    LegacyCustomResourceUpgrade:
    - >-
      Freeze notebook writes. Save the old template, stack resource IDs, outputs
      and SSM values. Build an explicit ownership manifest for both KB IDs,
      their data source IDs, vector bucket/index ARNs, memory ID and all layer
      version ARNs published by that stack. Read each KB's storage and service
      role to verify ownership; names alone are not ownership evidence. The old
      handlers could fail after creating resources but before publishing SSM,
      so reconcile their logs and creation history as well as current SSM.
    - >-
      Use a separately reviewed bridge update before repointing any SSM values:
      make the old KB, memory and layer handlers non-mutating during the handoff.
      The old memory Delete handler looks up its deletion target through SSM;
      without this bridge it can delete the replacement memory after cutover.
      Do not remove the old service roles or their vector permissions yet.
    - >-
      Import the inventoried resources into explicit native ownership in separate
      IMPORT change sets, using their current properties and temporary
      DeletionPolicy/UpdateReplacePolicy Retain. Import the old Developer Journey
      KB and vectors as Legacy resources; import the Playbook KB, source, vectors
      and memory under the intended final logical IDs where possible. Already
      native S3 buckets and IAM roles remain in their current stack. Import the
      four existing KB/data-source SSM parameters and memory_id before using
      this template's native parameters; never overwrite or adopt them by name.
      A resource already managed by another stack must not be imported twice.
    - >-
      In a reviewed staged UPDATE, create the distinctly named managed KB and
      source, upload and ingest the six documents, then verify managed retrieval
      before repointing the existing Developer Journey SSM IDs and kb/type.
      Keep the imported legacy KBs, indexes, original roles and manifest through
      this check so rollback remains possible. Apply the remaining template
      changes only after all imports and references have been reconciled.
    - >-
      After cutover is validated, retire only manifest-owned obsolete resources:
      old data sources (DataDeletionPolicy DELETE), then their KBs, vector
      indexes and empty vector buckets; retire superseded memory and unused
      layer versions only after their consumers have moved. Prefer reviewed
      native resource removals with DeletionPolicy/UpdateReplacePolicy Delete;
      any resource not importable needs an explicit ID-scoped retirement step.
      Remove legacy service roles last. Restore normal Delete policies for the
      final native resources and reconcile every manifest entry as still managed
      or deleted before closing migration. Retain is a temporary rollback aid,
      not permission to leave untracked orphans. Never run account-wide cleanup.
    ImportIdentifiers:
      AWS::Bedrock::KnowledgeBase: KnowledgeBaseId
      AWS::Bedrock::DataSource: KnowledgeBaseId and DataSourceId
      AWS::S3Vectors::VectorBucket: VectorBucketArn
      AWS::S3Vectors::Index: IndexArn
      AWS::SSM::Parameter: Name
    ImportReference: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resource-import-supported-resources.html
    NativeVectorDraftUpgrade: >-
      If the intermediate native VECTOR draft was deployed, CFN replaces the
      Developer Journey KB/source when Type changes. Stage the managed creation,
      ingestion and SSM cutover before retiring its native vector index/bucket;
      preserve the old Bedrock service role's vector permissions until its old
      data source has been deleted. Do not combine that retirement with an
      unreviewed blanket update. The Managed KB cannot be converted in place.
    ExecutionBoundary: >-
      These are migration instructions, not an automatic migration. This
      template's handlers never enumerate or adopt legacy resources, and no
      migration, import or resource deletion was executed while authoring it.
Resources:

  LambdaCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'lambda-code-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
      - Key: Application
        Value: CustomerSupport
      - Key: WorkshopStack
        Value: !Ref 'AWS::StackId'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256

  LambdaCodeSetupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3WritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${LambdaCodeBucket.Arn}/*'

  # Custom Resource Lambda to download and upload Lambda code
  LambdaCodeSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaCodeSetupRole.Arn
      Timeout: 900
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import zipfile
          import io
          import os
          import sys
          import subprocess
          import tempfile

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  bucket_name = event['ResourceProperties']['BucketName']
                  artifact_revision = event['ResourceProperties']['ArtifactRevision']
                  lambda_key = f'lambda-{artifact_revision}.zip'
                  s3 = boto3.client('s3')

                  # Build ddgs-layer.zip by pip-installing ddgs into a Lambda layer
                  # layout (python/ prefix). We build it here rather than downloading a
                  # prebuilt zip so the stack has no external (GitHub) runtime dependency.
                  with tempfile.TemporaryDirectory() as temp_dir:
                      python_dir = os.path.join(temp_dir, 'python')
                      os.makedirs(python_dir)
                      # Force Linux x86_64 wheels (ddgs pulls compiled deps: lxml,
                      # primp, brotli) so the layer matches the python3.12 x86_64 runtime,
                      # regardless of where pip happens to run.
                      subprocess.check_call([
                          sys.executable, '-m', 'pip', 'install',
                          'ddgs==9.14.4',
                          '--target', python_dir, '--no-cache-dir',
                          '--platform', 'manylinux2014_x86_64',
                          '--python-version', '3.12',
                          '--implementation', 'cp',
                          '--only-binary=:all:',
                      ])
                      layer_buf = io.BytesIO()
                      with zipfile.ZipFile(layer_buf, 'w', zipfile.ZIP_DEFLATED) as zf:
                          for root, _dirs, files in os.walk(python_dir):
                              for fname in files:
                                  fpath = os.path.join(root, fname)
                                  arcname = os.path.relpath(fpath, temp_dir)
                                  zf.write(fpath, arcname)
                      layer_buf.seek(0)
                      s3.put_object(Bucket=bucket_name, Key='ddgs-layer.zip', Body=layer_buf.read())
                  print("Built and uploaded ddgs-layer.zip")

                  # Create the revisioned Lambda artifact with inline code
                  lambda_code = io.BytesIO()
                  with zipfile.ZipFile(lambda_code, 'w', zipfile.ZIP_DEFLATED) as zf:
                      # lambda_function.py
                      zf.writestr('lambda_function.py', '''from check_warranty import check_warranty_status
          from web_search import web_search
          from support_info import get_return_policy, get_product_info


          def get_named_parameter(event, name):
              if name not in event:
                  return None
              return event.get(name)


          def lambda_handler(event, context):
              print(f"Event: {event}")
              print(f"Context: {context}")

              extended_tool_name = context.client_context.custom["bedrockAgentCoreToolName"]
              resource = extended_tool_name.rsplit("___", 1)[-1]

              print(resource)

              read_only_functions = {
                  "get_return_policy": get_return_policy,
                  "get_product_info": get_product_info,
              }
              if resource in read_only_functions:
                  try:
                      return {"statusCode": 200, "body": read_only_functions[resource](**event)}
                  except TypeError:
                      return {"statusCode": 400, "body": "Invalid or missing tool arguments"}

              if resource == "check_warranty_status":
                  serial_number = get_named_parameter(event=event, name="serial_number")
                  customer_email = get_named_parameter(event=event, name="customer_email")

                  if not serial_number:
                      return {"statusCode": 400, "body": "Please provide serial_number"}

                  try:
                      warranty_status = check_warranty_status(
                          serial_number=serial_number, customer_email=customer_email
                      )
                  except Exception as e:
                      print(e)
                      return {"statusCode": 400, "body": f"{e}"}

                  return {"statusCode": 200, "body": warranty_status}

              elif resource == "web_search":
                  keywords = get_named_parameter(event=event, name="keywords")
                  region = get_named_parameter(event=event, name="region") or "us-en"
                  max_results = get_named_parameter(event=event, name="max_results") or 5

                  if not keywords:
                      return {"statusCode": 400, "body": "Please provide keywords for search"}

                  try:
                      search_results = web_search(
                          keywords=keywords, region=region, max_results=int(max_results)
                      )
                  except Exception as e:
                      print(e)
                      return {"statusCode": 400, "body": f"{e}"}

                  return {"statusCode": 200, "body": f"Search Results: {search_results}"}

              return {"statusCode": 400, "body": f"Unknown toolname: {resource}"}
          ''')

