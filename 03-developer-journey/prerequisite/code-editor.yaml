AWSTemplateFormatVersion: '2010-09-09'
Description: Create a Code Editor instance with an Amazon CloudFront distribution for use in Workshop Studio. Version 1.7.0

Parameters:
  CodeEditorUser:
    Type: String
    Description: UserName for Code Editor
    Default: participant
    AllowedPattern: ^[a-z_][a-z0-9_-]{0,31}$
    ConstraintDescription: Must be a valid Linux username (1-32 chars, lowercase, starting with a letter or underscore)
  InstanceName:
    Type: String
    Description: Code Editor EC2 instance name
    Default: CodeEditor
  InstanceVolumeSize:
    Type: Number
    Description: Code Editor EC2 instance volume size in GB
    Default: 40
  InstanceType:
    Description: Code Editor EC2 instance type
    Type: String
    Default: m8g.large
  InstanceOperatingSystem:
    Description: Code Editor EC2 operating system
    Type: String
    Default: AmazonLinux-2023
    AllowedValues: ['AmazonLinux-2023', 'Ubuntu-22', 'Ubuntu-24']
  HomeFolder:
    Type: String
    Description: Folder to open in Code Editor
    Default: /workshop
    AllowedPattern: ^/[A-Za-z0-9_][A-Za-z0-9_/.-]*$
    ConstraintDescription: Must be an absolute path starting with / and an alphanumeric or underscore character
  DevServerBasePath:
    Type: String
    Description: Base path for the application to be added to Nginx sites-available list
    Default: ''
  DevServerPort:
    Type: Number
    Description: Port for the DevServer
    Default: 8081
  RepoUrl:
    Description: Remote repo URL to clone (https, git SSH, or codecommit::). The literal placeholder {.Region} is replaced with the stack's region at bootstrap time. Leave blank to skip.
    Type: String
    Default: 'https://github.com/aws-samples/sample-optimizing-cost-latency-and-quality-on-amazon-bedrock.git'
    AllowedPattern: ^$|^[A-Za-z0-9:/@._~+%{}-]+$
    ConstraintDescription: Must be a valid repo URL containing only letters, digits, and the characters :/@._~+%{}- (shell metacharacters are rejected)
  RepoRef:
    Type: String
    Default: main
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9/._-]*$
    Description: >-
      Full commit SHA, branch, or tag of the workshop notebooks to fetch and check out
      detached. Use a commit SHA or release tag to reproduce a specific workshop version.
  RepoArchiveBucket:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >-
      Optional same-account S3 bucket for a private notebook source ZIP (SSE-S3).
      Set bucket, key, and SHA-256 together. Explicit S3 source overrides RepoUrl/RepoRef;
      download or validation failure aborts bootstrap without falling back to Git.
  RepoArchiveKey:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9/._-]*\.zip$'
    Description: >-
      Exact object key, preferably snapshots/<sha256>.zip. ZIP must contain project source,
      pyproject.toml, uv.lock and all four requirements lock exports at root
      (runtime, runtime-langfuse, notebook and langfuse). No enclosing directory, .git, .venv,
      links or special files. HomeFolder must be empty. Leave all legacy asset/folder/branch
      ZIP parameters blank.
  RepoArchiveSha256:
    Type: String
    Default: ''
    AllowedPattern: '^([a-fA-F0-9]{64})?$'
    Description: >-
      Required SHA-256 of the complete ZIP when S3 source is configured; pins exact bytes even
      if the object key is overwritten. Maximum ZIP size 512 MiB, expanded size 2 GiB and
      50000 entries. Store only files intended for the private workshop instance.
  ObservabilityBackend:
    Type: String
    Default: agentcore
    AllowedValues: [agentcore, langfuse, both, none]
    Description: Backend passed to notebook helpers. This setting does not initialize telemetry.
  NotebookLogGroup:
    Type: String
    Default: /aws/bedrock-agentcore/workshop/notebook-agents
    AllowedPattern: ^[./A-Za-z0-9_-]+$
    Description: Log group provisioned by the infrastructure stack before AWS telemetry is initialized.
  ClaudeModelId:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Za-z0-9][A-Za-z0-9:./_-]*$
    Description: Optional event-validated Bedrock model/profile ID for Claude Code; blank uses its default.
  ClaudeHaikuModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9:./_-]*$
    Description: Bedrock model/profile ID for ANTHROPIC_DEFAULT_HAIKU_MODEL; validate access in the event region.
  InfrastructureStackName:
    Type: String
    Default: infrastructure
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]{0,127}$
    Description: Stack name used to scope legacy generated Gateway and Lambda role names.
  RuntimeRoleArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
    Description: Optional exact Runtime role ARN; blank uses the infrastructure's techmart-runtime-<region> role.
  EvaluationRoleArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
    Description: Optional exact evaluation role ARN; blank uses the infrastructure's techmart-evaluation-<region> role.
  ABTestRoleArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
    Description: Optional exact A/B role ARN; blank uses the infrastructure's techmart-abtest-<region> role.
  AssetZipS3Path:
    Description: S3 path holding the asset zip file to be copied into the home folder. To not include any assets, leave blank
    Type: String
    Default: ''
  BranchZipS3Path:
    Description: S3 path holding the branches zip file to be checked into the git repo, with each folder being a branch. The content of each folder will added as under a branch, with the folder name being used as the branch name. To leave the empty, leave blank
    Type: String
    Default: ''
  FolderZipS3Path:
    Description: S3 path holding the folder zip file, with each folder being a subfolder of the home directory. Each folder will have its own local git repo. To not include any folders, leave blank
    Type: String
    Default: ''

Conditions:
  IsAL2023: !Equals [!Ref InstanceOperatingSystem, 'AmazonLinux-2023']
  HasRepoArchive: !Not [!Equals [!Ref RepoArchiveBucket, '']]
  HasRuntimeRoleArn: !Not [!Equals [!Ref RuntimeRoleArn, '']]
  HasEvaluationRoleArn: !Not [!Equals [!Ref EvaluationRoleArn, '']]
  HasABTestRoleArn: !Not [!Equals [!Ref ABTestRoleArn, '']]
  # Graviton iff family contains 'g' AND does not start with 'g'. Misses a1/g5g/inf/trn (obvious at boot).
  IsGraviton: !And
    - !Not
      - !Equals # family contains 'g' (e.g. t4g, c7gd, im4gn; rejects m5, a1)
        - !Select [0, !Split ['.', !Ref InstanceType]]
        - !Join ['', !Split ['g', !Select [0, !Split ['.', !Ref InstanceType]]]]
    - !Not
      - !Equals # family does not start with 'g' (rejects g5, g4dn, g6, g5g)
        - !Select [0, !Split ['g', !Select [0, !Split ['.', !Ref InstanceType]]]]
        - ''

Rules:
  CompleteRepoArchive:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref RepoArchiveBucket, '']
            - !Equals [!Ref RepoArchiveKey, '']
            - !Equals [!Ref RepoArchiveSha256, '']
          - !And
            - !Not [!Equals [!Ref RepoArchiveBucket, '']]
            - !Not [!Equals [!Ref RepoArchiveKey, '']]
            - !Not [!Equals [!Ref RepoArchiveSha256, '']]
        AssertDescription: Set RepoArchiveBucket, RepoArchiveKey and RepoArchiveSha256 together, or leave all blank.
  RepoArchiveWithoutOverlays:
    RuleCondition: !Not [!Equals [!Ref RepoArchiveBucket, '']]
    Assertions:
      - Assert: !And
          - !Equals [!Ref AssetZipS3Path, '']
          - !Equals [!Ref FolderZipS3Path, '']
          - !Equals [!Ref BranchZipS3Path, '']
        AssertDescription: S3 notebook source cannot be combined with legacy asset, folder or branch ZIP overlays.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceName
          - InstanceVolumeSize
          - InstanceType
          - InstanceOperatingSystem
      - Label:
          default: Code Editor Configuration
        Parameters:
          - CodeEditorUser
          - HomeFolder
          - DevServerBasePath
          - DevServerPort
          - RepoUrl
          - RepoRef
          - RepoArchiveBucket
          - RepoArchiveKey
          - RepoArchiveSha256
          - AssetZipS3Path
          - BranchZipS3Path
          - FolderZipS3Path
      - Label:
          default: Workshop Runtime and Observability
        Parameters:
          - ObservabilityBackend
          - NotebookLogGroup
          - InfrastructureStackName
          - RuntimeRoleArn
          - EvaluationRoleArn
          - ABTestRoleArn
          - ClaudeModelId
          - ClaudeHaikuModelId
    ParameterLabels:
      CodeEditorUser:
        default: Code Editor user name
      InstanceName:
        default: Instance name
      InstanceVolumeSize:
        default: Instance volume size
      InstanceType:
        default: Instance type
      InstanceOperatingSystem:
        default: Instance operating system
      HomeFolder:
        default: Code Editor home folder
      DevServerBasePath:
        default: Application base path
      DevServerPort:
        default: Application port
      RepoUrl:
        default: Git repo URL
      AssetZipS3Path:
        default: Asset file S3 path
      BranchZipS3Path:
        default: Branch file S3 path
      FolderZipS3Path:
        default: Folder file S3 path

